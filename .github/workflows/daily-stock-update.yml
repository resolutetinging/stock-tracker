name: Daily Stock Update

on:
  schedule:
    # 平日 UTC 07:30 = 台北時間 15:30，TWSE盤後資料留緩衝時間
    # 刻意跟現有排程（nvidia/renewable週日16:00 UTC、industry-adoption每月1號16:00 UTC）錯開
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull latest before running (avoid push conflicts)
        run: git pull --rebase origin main

      - name: Run update script
        run: python3 scripts/update_stocks.py

      - name: Commit and push data changes
        env:
          COMMIT_MSG: "auto update: stock tracker data"
          FILES: 'data/stock_history.json data/alerts_log.json'
        run: |
          # 同一 repo 有多支排程會推送：push 被拒時先 rebase 到最新再推，最多 5 次
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 被拒（第 $i 次），同步最新版本後重試"
            sleep $((i * 10))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
