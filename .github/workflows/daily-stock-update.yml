name: Daily Stock Update

on:
  schedule:
    # 平日 UTC 07:30 = 台北時間 15:30，TWSE盤後資料留緩衝時間
    # 刻意跟現有排程（nvidia/renewable週日16:00 UTC、industry-adoption每月1號16:00 UTC）錯開
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull latest before running (avoid push conflicts)
        run: git pull --rebase origin main

      - name: Run update script
        run: python3 scripts/update_stocks.py

      - name: Commit and push data changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto update: stock tracker data"
          file_pattern: 'data/stock_history.json data/alerts_log.json'
