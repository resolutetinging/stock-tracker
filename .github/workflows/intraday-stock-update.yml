name: Intraday Stock Update

on:
  schedule:
    # 目標：台北時間09:00-13:30（TWSE盤中時段），平日，每15分鐘一次
    # UTC = 台北時間 - 8小時
    # 第一段：UTC 01:00-04:45（=台北09:00-12:45），每15分鐘一次
    - cron: '*/15 1-4 * * 1-5'
    # 第二段：UTC 05:00/05:15/05:30（=台北13:00/13:15/13:30），收尾到台北13:30
    - cron: '0,15,30 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull latest before running (avoid push conflicts)
        run: git pull --rebase origin main

      - name: Run intraday update script
        run: python3 scripts/update_intraday.py

      - name: Commit and push data changes
        env:
          COMMIT_MSG: "auto update: intraday stock snapshot"
          FILES: 'data/intraday.json'
        run: |
          # 同一 repo 有多支排程會推送：push 被拒時先 rebase 到最新再推，最多 5 次
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 被拒（第 $i 次），同步最新版本後重試"
            sleep $((i * 10))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
